<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>item list</title>
  <link href="../static/css/style.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <header style="position: sticky; top: 0;">
    <div class="header-container">
      <button id="header-backarrow-button" class="header-backarrow-button">
        <img src="../static/res/backArrowIcon.svg">
      </button>
      <h1 id="item-general-title" class="header-general-title">title</h1>
    </div>
    <button id="add-btn" class="add-btn" onclick="dialogHandler('add', 'open')">Add</button>
  </header>
  <main>
    <!-- add dialog start -->
    <div id="add-dialog-fade" class="dialog-fade" onclick="dialogHandler('add', 'close')">
      <div class="dialog-position-margin-area"></div>
      <div class="center-container">
        <form method="POST" charset="utf-8" action="/add">
          <div id="add-dialog-bg" class="dialog-content-container">
            <div class="center-container">
              <div class="dialog-content-margin-area"></div>
              <label class="add-dialog-label">Category</label>
              <input required id="add-dialog-input-category" type="text" name="add_category" class="input-text">
              <div class="dialog-margin-area"></div>
              <label class="add-dialog-label">Item name</label>
              <input required id="add-dialog-input-item" type="text" name="add_item" class="input-text">
              <div class="dialog-content-margin-area"></div>
              <div class="dialog-content-margin-area"></div>
            </div>
          </div>
          <div id="add-dialog-button" class="dialog-content-container" style="margin-top: 0.3rem;">
            <button class="dialog-content-button">Cancel</button>
            <div class="dialog-line-vertical"></div>
            <button id="apply-button" type="submit" class="dialog-content-button">Apply</button>
          </div>
        </form>
      </div>
    </div>
    <!-- add dialog end -->
    <!-- menu dialog start -->
    <div id="menu-dialog-fade" class="dialog-fade" onclick="dialogHandler('menu', 'close')">
      <div class="dialog-margin-area"></div>
        <div class="dialog-general-container">
        <div class="center-container">
          <div id="menu-content" class="dialog-content-container"></div>
          <div class="dialog-margin-area"></div>
          <form class="dialog-content-container" method="POST" charset="utf-8" action="/add">
            <div class="center-container">
              <button id="modify-button" class="dialog-content-button" type="button" onclick="dialogHandler('modify', 'open')">Modify</button>
              <div class="dialog-line-horizontal"></div>
              <button id="move-button" class="dialog-content-button" type="button">Move</button>
              <div class="dialog-line-horizontal"></div>
              <button id="remove-button" class="dialog-content-button" type="button" onclick="removeItem('menu-content')">Remove</button>
            </div>
          </form>
          <div class="dialog-margin-area"></div>
          <div class="dialog-content-container">
            <button id="cancel-button" class="dialog-content-button">Cancel</button>
          </div>
        </div>
      </div>
    </div>
    <!-- menu dialog end -->
    <!-- modify dialog start -->
    <div id="modify-dialog-fade" class="dialog-fade" onclick="dialogHandler('modify', 'close')">
      <div class="dialog-general-container">
        <div class="center-container">
          <div id="modify-content" class="dialog-content-container"></div>
          <!--TODO: modify 만들기, menu 스크롤 시 잘려서 나오는 문제 해결하기-->
        </div>
      </div>

    </div>
    <!-- modify dialog end -->
    <!-- item list start -->
    <form id="category-container" class="category-container">
    </form>
    <!-- item list end -->
  </main>
  <script src="../static/js/script.js"></script>
</body>
</html>
